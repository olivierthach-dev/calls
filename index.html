<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal d'appels</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.app-shell {
  --green: #043F47;
  --grey: #EDEDED;
  --white: #FFFFFF;
  --midnight: #171733;
  --plum: #42033D;
  --cyan: #16E6FF;
  --ink: #171733;
  --ink-soft: #5B5B6B;
  --paper: #EDEDED;
  --paper-raised: #FFFFFF;
  --line: #DCDCDC;
  --unanswered: #B33A30;
  --potential: #42033D;
  --demo: #043F47;
  font-family: 'Manrope', -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  padding: 0 32px 36px;
}
.app-shell * { box-sizing: border-box; font-family: inherit; }
.app-shell h1, .app-shell h2 { font-family: 'Manrope', sans-serif; margin: 0; }
.app-shell h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; color: var(--green); }
.app-shell h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--green); }
.subtitle { margin: 5px 0 0; color: var(--ink-soft); font-size: 13.5px; }

.masthead-bar {
  height: 6px; margin: 0 -32px 28px; background: linear-gradient(
    90deg, var(--unanswered) 0 33%, var(--potential) 33% 66%, var(--demo) 66% 100%
  );
}

.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; padding-top: 28px; }
.topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reset-confirm { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); background: var(--grey); border-radius: 8px; padding: 6px 10px; }
.lang-switch { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); border: 1px solid var(--line); background: var(--white); border-radius: 8px; padding: 4px 8px 4px 10px; }
.lang-btn { border: none; background: transparent; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
.lang-btn.active { background: var(--green); color: var(--white); }

.btn-primary, .btn-secondary {
  border: 1.5px solid var(--green); border-radius: 8px; padding: 10px 16px;
  font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex;
  align-items: center; gap: 6px; transition: transform .1s ease, opacity .1s ease;
}
.btn-primary { background: var(--green); color: var(--white); }
.btn-primary:hover { transform: translateY(-1px); opacity: .92; }
.btn-secondary { background: var(--white); color: var(--green); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--green); }

.agent-select, .agent-filter, select, input, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
  font-size: 13.5px; background: var(--white); color: var(--ink);
}
.agent-select, .agent-filter { font-weight: 600; }
.agent-add { display: flex; gap: 6px; align-items: center; }
.agent-add input { width: 140px; }

.filters { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--white); }
.seg { padding: 8px 16px; font-size: 13px; background: transparent; border: none; border-right: 1px solid var(--line); cursor: pointer; color: var(--ink-soft); font-weight: 600; }
.seg:last-child { border-right: none; }
.seg.active { background: var(--green); color: var(--white); }
.period-nav { display: flex; align-items: center; gap: 8px; }
.period-label { font-size: 13.5px; min-width: 200px; font-weight: 600; }
.icon-btn { border: 1px solid var(--line); background: var(--white); border-radius: 8px; padding: 6px 8px; cursor: pointer; display: inline-flex; align-items: center; color: var(--ink-soft); }
.icon-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn.danger { color: #7A2A24; border-color: var(--unanswered); background: #F4DCD9; font-size: 12px; padding: 6px 8px; }

.summary { font-size: 15.5px; font-weight: 500; color: var(--ink); margin: 2px 0 24px; max-width: 68ch; line-height: 1.5; }

.quickbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.quickbar-hint { font-size: 13px; color: var(--ink-soft); width: 100%; margin: 0 0 4px; }
.quickbar-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.quick-btn {
  display: flex; align-items: center; gap: 10px; padding: 15px 22px;
  border: 1.5px solid var(--qc); border-radius: 10px; background: var(--qs); color: var(--qc);
  font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .1s ease, box-shadow .1s ease;
}
.quick-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px -4px var(--qc); }
.quick-btn:disabled { opacity: .4; cursor: default; }
.quickbar-more { margin-left: auto; font-size: 12.5px; padding: 8px 12px; }

.followup {
  background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--cyan);
  border-radius: 10px; padding: 16px 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;
}
.followup-head { display: flex; align-items: center; gap: 10px; }
.followup-time { font-size: 12.5px; color: var(--ink-soft); }
.followup-close { margin-left: auto; }
.followup-client-row { display: flex; gap: 8px; align-items: center; }
.followup-client { max-width: 280px; }
.followup-save { font-size: 12.5px; padding: 8px 12px; white-space: nowrap; }
.followup-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.followup-date, .followup-time-input { padding: 6px 9px; font-size: 12.5px; }
.followup-date { width: 130px; }
.followup-time-input { width: 90px; }
.followup-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.chip-btn {
  border: 1px solid var(--line); background: var(--grey); border-radius: 8px;
  padding: 6px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink); font-weight: 600;
}
.chip-btn:hover { border-color: var(--green); background: var(--white); }

.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 26px; }
.ticket {
  position: relative; background: var(--white); border: 1px solid var(--line); border-top: 4px solid var(--line);
  border-radius: 12px; padding: 20px 20px 16px;
}
.ticket-icon { margin-bottom: 10px; }
.ticket-value { font-family: 'Manrope', sans-serif; font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
.ticket-label { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 600; }
.ticket-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; opacity: .8; }
.ticket-hero { background: var(--green); border-top-color: var(--green); }
.hero-value { color: var(--white); }
.hero-label { color: var(--white); font-weight: 700; opacity: 1; }
.hero-sub { color: var(--white); opacity: .75; }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.panel { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-head h2 { margin-bottom: 0; }
.segmented.small { font-size: 12px; }
.segmented.small .seg { padding: 5px 10px; font-size: 12px; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--ink-soft); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.chart-empty { color: var(--ink-soft); font-size: 13px; padding: 30px 0; text-align: center; }

.demo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.demo-list li { display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.demo-list li:last-child { border-bottom: none; padding-bottom: 0; }
.demo-date { display: flex; flex-direction: column; min-width: 70px; font-size: 12.5px; }
.demo-date strong { font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 800; color: var(--green); }
.demo-info { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13.5px; align-items: baseline; }
.demo-client { font-weight: 700; }
.demo-agent { color: var(--ink-soft); font-size: 12.5px; }
.demo-notes { color: var(--ink-soft); font-size: 12.5px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 700; color: var(--ink-soft); padding: 9px 10px; border-bottom: 1.5px solid var(--line); font-size: 11.5px; letter-spacing: 0.02em; }
.sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
.sortable-th:hover { color: var(--green); }
.sort-arrow { display: inline-block; width: 10px; font-size: 10px; margin-left: 3px; }
td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover { background: var(--grey); }
.mono { font-weight: 600; white-space: nowrap; color: var(--ink-soft); font-size: 13px; }
.notes-cell { max-width: 320px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.row-actions { display: flex; gap: 6px; white-space: nowrap; }
.empty { color: var(--ink-soft); font-size: 13.5px; }

.inline-form { border-left: 4px solid var(--cyan); display: flex; flex-direction: column; gap: 15px; }
.drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.inline-add { display: flex; gap: 6px; }
.status-toggle { display: flex; flex-wrap: wrap; gap: 7px; }
.status-btn { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); cursor: pointer; font-size: 13.5px; color: var(--ink); font-weight: 600; }
.status-btn.active { font-weight: 800; }
.drawer-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }
.banner-error { background: #F4DCD9; border: 1px solid var(--unanswered); color: #7A2A24; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13.5px; }
.banner-danger { padding: 14px 16px; }

.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

svg.icon { display: block; flex-shrink: 0; }

@media (max-width: 760px) {
  .app-shell { padding: 0 16px 24px; }
  .masthead-bar { margin: 0 -16px 20px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
}
</style>
</head>

<div id="app" class="app-shell"></div>

  { code: "fr", label: "FR" },

}

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

function plural(lang, n, key) {
  var forms = {
    fr: { call: ["appel","appels"], contact: ["contact","contacts"], scheduled: ["programmé","programmés"] },

    es: { call: ["llamada","llamadas"], contact: ["contacto","contactos"], scheduled: ["programado","programados"] }
  };
  return forms[lang][key][n === 1 ? 0 : 1];
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

// ================= date helpers =================

function startOfDay(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { return new Date(d.getTime() + n * DAY_MS); }
function startOfWeek(d) { var x = startOfDay(d); var dow = (x.getDay() + 6) % 7; return addDays(x, -dow); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function fmtShort(d) { return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); }
function fmtLong(d, lang) {
  var month = MONTHS[lang][d.getMonth()], day = d.getDate(), year = d.getFullYear();
  if (lang === "en") return month + " " + day + ", " + year;
  if (lang === "es") return day + " de " + month + " de " + year;
  return day + " " + month + " " + year;
}
function fmtDayLabel(d, lang) {
  var wd = WEEKDAYS[lang][(d.getDay() + 6) % 7];
  return lang === "en" ? wd + ", " + fmtLong(d, lang) : wd + " " + fmtLong(d, lang);
}
function toInputDate(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function toInputTime(d) { return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }

function rangeForPeriod(type, offset, lang) {
  var today = new Date();
  if (type === "day") {
    var start = addDays(startOfDay(today), offset);
    return { start: start, end: addDays(start, 1), label: fmtDayLabel(start, lang) };
  }
  if (type === "week") {
    var start = addDays(startOfWeek(today), offset * 7);
    var end = addDays(start, 7);
    var last = addDays(end, -1);
    return { start: start, end: end, label: STRINGS[lang].weekOf(fmtShort(start), fmtShort(last), last.getFullYear()) };
  }
  var base = startOfMonth(today);
  var start2 = new Date(base.getFullYear(), base.getMonth() + offset, 1);
  var end2 = new Date(base.getFullYear(), base.getMonth() + offset + 1, 1);
  return { start: start2, end: end2, label: cap(MONTHS[lang][start2.getMonth()]) + " " + start2.getFullYear() };
}

var SHEET_API_URL = "https://script.google.com/a/macros/sosafe.de/s/AKfycbxbAsAvon3QfEAhJs0viWJaSsY5-krwPt2Rj8_K_0AivMOMIMGpcOZjWABMofhZ35n4IA/exec";

function apiGet(key) {
  return fetch(SHEET_API_URL + "?key=" + encodeURIComponent(key), { method: "GET" })
    .then(function (r) { return r.json(); })
    .then(function (data) { return data && data.value != null ? data.value : null; });
}
function apiSet(key, value) {
  return fetch(SHEET_API_URL, { method: "POST", body: JSON.stringify({ key: key, value: value }) })
    .then(function (r) { return r.json(); });
}

// ================= state =================

var state = {
  agents: [],
  calls: [],
  currentAgent: "",
  lang: "fr",
  periodType: "week",
  periodOffset: 0,
  filterAgent: "all",
  trendDays: 14,
  sortKey: "dateTime",
  sortDir: "desc",
  historyStatusFilter: "all",
  showForm: false,
  editingId: null,
  confirmDeleteId: null,
  confirmReset: false,
  lastLoggedId: null,
  addingAgentTop: false,
  addingAgentForm: false,
  dataLoading: true,
  dataError: "",
  syncing: false
};
var quickClientDraft = "";
var quickSaved = false;
var formDraft = null;

function loadLocalPrefs() {
  state.lang = localStorage.getItem("ja_lang") || "fr";
  if (!STRINGS[state.lang]) state.lang = "fr";
  state.currentAgent = localStorage.getItem("ja_current_agent") || "";
}

function loadRemoteData() {
  if (!SHEET_API_URL) {
    state.calls = [];
    state.agents = [];
    state.dataLoading = false;
    state.dataError = "config";
    render();
    return;
  }
  state.dataLoading = true;
  render();
  Promise.all([apiGet("calls"), apiGet("agents")])
    .then(function (results) {
      try { state.calls = results[0] ? JSON.parse(results[0]) : []; } catch (e) { state.calls = []; }
      try { state.agents = results[1] ? JSON.parse(results[1]) : []; } catch (e) { state.agents = []; }
      if (!state.currentAgent && state.agents.length) state.currentAgent = state.agents[0];
      state.dataError = "";
    })
    .catch(function () { state.dataError = "network"; })
    .then(function () { state.dataLoading = false; render(); });
}

function refreshFromServer(silent) {
  if (!SHEET_API_URL) return;
  if (!silent) { state.syncing = true; render(); }
  Promise.all([apiGet("calls"), apiGet("agents")])
    .then(function (results) {
      try { state.calls = results[0] ? JSON.parse(results[0]) : []; } catch (e) {}
      try { state.agents = results[1] ? JSON.parse(results[1]) : []; } catch (e) {}
      state.dataError = "";
    })
    .catch(function () { if (!silent) state.dataError = "network"; })
    .then(function () { state.syncing = false; render(); });
}

function saveCalls() {
  if (!SHEET_API_URL) return;
  apiSet("calls", JSON.stringify(state.calls)).catch(function () { state.dataError = "network"; render(); });
}
function saveAgents() {
  if (!SHEET_API_URL) return;
  apiSet("agents", JSON.stringify(state.agents)).catch(function () { state.dataError = "network"; render(); });
}
function saveCurrentAgent() { try { localStorage.setItem("ja_current_agent", state.currentAgent); } catch (e) {} }
function saveLang() { try { localStorage.setItem("ja_lang", state.lang); } catch (e) {} }

function addAgentIfNew(name) {
  var trimmed = (name || "").trim();
  if (!trimmed) return;
  if (state.agents.indexOf(trimmed) === -1) { state.agents.push(trimmed); saveAgents(); }
}

// ================= derived data =================

function getRange() { return rangeForPeriod(state.periodType, state.periodOffset, state.lang); }

function getPeriodCalls(range) {
  return state.calls.filter(function (c) {
    var t = new Date(c.dateTime);
    if (t < range.start || t >= range.end) return false;
    if (state.filterAgent !== "all" && c.agent !== state.filterAgent) return false;
    return true;
  });
}

function getStats(periodCalls) {
  var total = periodCalls.length;
  var unanswered = periodCalls.filter(function (c) { return c.status === "unanswered"; }).length;
  var potential = periodCalls.filter(function (c) { return c.status === "potential"; }).length;
  var demoBooked = periodCalls.filter(function (c) { return c.status === "demo_booked"; }).length;
  var refused = periodCalls.filter(function (c) { return c.status === "refused"; }).length;
  return { total: total, unanswered: unanswered, potential: potential, demoBooked: demoBooked, refused: refused };
}

function getAgentBreakdown(periodCalls) {
  if (state.filterAgent !== "all") return [];
  var map = {};
  periodCalls.forEach(function (c) {
    if (!map[c.agent]) map[c.agent] = { agent: c.agent, unanswered: 0, potential: 0, demo_booked: 0, refused: 0 };
    map[c.agent][c.status] = (map[c.agent][c.status] || 0) + 1;
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
    return (b.unanswered + b.potential + b.demo_booked + b.refused) - (a.unanswered + a.potential + a.demo_booked + a.refused);
  });
}

function getTrendData() {
  var days = [];
  for (var i = state.trendDays - 1; i >= 0; i--) {
    var dayStart = addDays(startOfDay(new Date()), -i);
    var dayEnd = addDays(dayStart, 1);
    var dayCalls = state.calls.filter(function (c) {
      var t = new Date(c.dateTime);
      if (t < dayStart || t >= dayEnd) return false;
      if (state.filterAgent !== "all" && c.agent !== state.filterAgent) return false;
      return true;
    });
    days.push({
      day: fmtShort(dayStart),
      unanswered: dayCalls.filter(function (c) { return c.status === "unanswered"; }).length,
      potential: dayCalls.filter(function (c) { return c.status === "potential"; }).length,
      demo_booked: dayCalls.filter(function (c) { return c.status === "demo_booked"; }).length,
      refused: dayCalls.filter(function (c) { return c.status === "refused"; }).length
    });
  }
  return days;
}

function getUpcomingActions() {
  var now = new Date();
  return state.calls
    .filter(function (c) { return c.nextAction && c.nextAction.dateTime && new Date(c.nextAction.dateTime) >= now; })
    .filter(function (c) { return state.filterAgent === "all" || c.agent === state.filterAgent; })
    .sort(function (a, b) { return new Date(a.nextAction.dateTime) - new Date(b.nextAction.dateTime); })
    .slice(0, 8);
}

function getSortedCalls(periodCalls) {
  var dir = state.sortDir === "asc" ? 1 : -1;
  var t = STRINGS[state.lang];
  function valueFor(c) {
    switch (state.sortKey) {
      case "agent": return c.agent || "";
      case "client": return c.client || "";
      case "status": return t.status[c.status] || t.status.unanswered;
      case "nextAction": return (c.nextAction && c.nextAction.dateTime) ? new Date(c.nextAction.dateTime).getTime() : -Infinity;
      default: return new Date(c.dateTime).getTime();
    }
  }
  return periodCalls.slice().sort(function (a, b) {
    var va = valueFor(a), vb = valueFor(b);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  });
}

// ================= actions =================

function quickLog(status) {
  if (!state.currentAgent) return;
  var record = { id: uid(), agent: state.currentAgent, dateTime: new Date().toISOString(), status: status, client: "", notes: "", nextAction: null };
  state.calls.push(record);
  saveCalls();
  state.lastLoggedId = record.id;
  quickClientDraft = "";
  quickSaved = false;
  render();
}

function findCall(id) { return state.calls.find(function (c) { return c.id === id; }) || null; }

function updateCall(id, patch) {
  state.calls = state.calls.map(function (c) { return c.id === id ? Object.assign({}, c, patch) : c; });
  saveCalls();
}

function saveQuickClientDraft() {
  var last = findCall(state.lastLoggedId);
  if (!last) return;
  var input = document.getElementById("quick-client-input");
  var val = input ? input.value.trim() : quickClientDraft.trim();
  var patch = {};
  var changed = false;
  if (val !== (last.client || "")) { patch.client = val; changed = true; }
  var notesInput = document.getElementById("quick-notes-input");
  if (notesInput) {
    var notesVal = notesInput.value.trim();
    if (notesVal !== (last.notes || "")) { patch.notes = notesVal; changed = true; }
  }
  if (changed) updateCall(last.id, patch);
}

function applyQuickNextAction(daysOffset, type) {
  var last = findCall(state.lastLoggedId);
  if (!last) return;
  var dt = addDays(new Date(last.dateTime), daysOffset);
  updateCall(last.id, { nextAction: { type: type, dateTime: dt.toISOString(), notes: "" } });
  render();
}

function deleteCall(id) {
  state.calls = state.calls.filter(function (c) { return c.id !== id; });
  saveCalls();
  state.confirmDeleteId = null;
  render();
}

function resetAllCalls() {
  state.calls = [];
  saveCalls();
  state.lastLoggedId = null;
  state.confirmReset = false;
  render();
}

function emptyFormDraft() {
  var now = new Date();
  return {
    agent: state.currentAgent || state.agents[0] || "",
    date: toInputDate(now),
    time: toInputTime(now),
    status: "unanswered",
    client: "",
    notes: "",
    nextActionDate: "",
    nextActionTime: "",
    nextActionNotes: "",
    addingAgent: false,
    agentDraft: ""
  };
}

function openNewForm() {
  state.editingId = null;
  formDraft = emptyFormDraft();
  state.showForm = true;
  render();
}

function openEditForm(call) {
  var dt = new Date(call.dateTime);
  var na = call.nextAction;
  var naDate = na && na.dateTime ? new Date(na.dateTime) : null;
  state.editingId = call.id;
  formDraft = {
    agent: call.agent,
    date: toInputDate(dt),
    time: toInputTime(dt),
    status: call.status,
    client: call.client || "",
    notes: call.notes || "",
    nextActionDate: naDate ? toInputDate(naDate) : "",
    nextActionTime: naDate ? toInputTime(naDate) : "",
    nextActionNotes: (na && na.notes) || "",
    addingAgent: false,
    agentDraft: ""
  };
  state.showForm = true;
  render();
}

function submitForm(e) {
  e.preventDefault();
  syncFormDraftFromDOM();
  if (!formDraft.agent || !formDraft.agent.trim()) return;
  addAgentIfNew(formDraft.agent);
  var dateTime = new Date(formDraft.date + "T" + (formDraft.time || "00:00")).toISOString();
  var autoType = nextActionTypeFor(formDraft.status);
  var nextAction = (autoType && formDraft.nextActionDate) ? {
    type: autoType,
    dateTime: new Date(formDraft.nextActionDate + "T" + (formDraft.nextActionTime || "00:00")).toISOString(),
    notes: (formDraft.nextActionNotes || "").trim()
  } : null;
  var record = {
    id: state.editingId || uid(),
    agent: formDraft.agent.trim(),
    dateTime: dateTime,
    status: formDraft.status,
    client: (formDraft.client || "").trim(),
    notes: (formDraft.notes || "").trim(),
    nextAction: nextAction
  };
  if (state.editingId) {
    state.calls = state.calls.map(function (c) { return c.id === state.editingId ? record : c; });
  } else {
    state.calls.push(record);
    state.currentAgent = record.agent;
    saveCurrentAgent();
  }
  saveCalls();
  state.showForm = false;
  formDraft = null;
  render();
}

function syncFormDraftFromDOM() {
  if (!formDraft) return;
  var ids = ["date","time","client","notes","nextActionDate","nextActionTime","nextActionNotes"];
  ids.forEach(function (id) {
    var el = document.getElementById("form-" + id);
    if (el) formDraft[id] = el.value;
  });
  var agentSel = document.getElementById("form-agent-select");
  if (agentSel) formDraft.agent = agentSel.value;
  var agentInput = document.getElementById("form-agent-draft");
  if (agentInput) formDraft.agentDraft = agentInput.value;
}

function closeForm() {
  state.showForm = false;
  formDraft = null;
  render();
}

// ================= rendering =================

var root = document.getElementById("app");

function render() {
  var t = STRINGS[state.lang];

  if (state.dataLoading) {
    root.innerHTML = '<div class="masthead-bar"></div>' +
      '<div style="display:flex;align-items:center;gap:10px;padding:40px;color:var(--ink-soft)">' + spinnerSvg() + ' ' + esc(loadingLabel()) + '</div>';
    return;
  }

  var range = getRange();
  var periodCalls = getPeriodCalls(range);
  var stats = getStats(periodCalls);
  var agentBreakdown = getAgentBreakdown(periodCalls);
  var trendData = getTrendData();
  var upcoming = getUpcomingActions();
  var sorted = getSortedCalls(periodCalls);
  var visible = state.historyStatusFilter === "all" ? sorted : sorted.filter(function (c) { return c.status === state.historyStatusFilter; });
  var summarySentence = t.summary(range.label, stats, upcoming.length);

  var html = "";
  html += '<div class="masthead-bar"></div>';
  if (state.dataError === "config") html += configBanner(t);
  else if (state.dataError === "network") html += networkBanner(t);
  if (state.confirmReset) html += resetConfirmBanner(t);
  html += renderHeader(t);
  html += renderQuickbar(t);
  html += renderFollowup(t);
  if (state.showForm) html += renderForm(t);
  html += renderFilters(t, range);
  html += '<p class="summary">' + esc(summarySentence) + '</p>';
  html += renderKpis(t, stats);
  html += renderCharts(t, agentBreakdown, trendData);
  html += renderUpcoming(t, upcoming);
  html += renderHistory(t, range, sorted, visible);

  root.innerHTML = html;
  attachEvents(t);
}

function spinnerSvg() {
  return '<svg class="icon spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>';
}
function loadingLabel() {
  return state.lang === "en" ? "Loading shared data…" : (state.lang === "es" ? "Cargando los datos compartidos…" : "Chargement des données partagées…");
}
function configBanner(t) {
  var msg = state.lang === "en"

function renderBarChart(data) {
  var W = 560, H = 220, padL = 30, padB = 26, padT = 8, padR = 8;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var maxVal = Math.max(1, Math.max.apply(null, data.map(function (d) { return d.unanswered + d.potential + d.demo_booked + d.refused; })));
  var n = data.length;
  var slot = innerW / n;
  var barW = Math.min(46, slot * 0.55);
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:220px;overflow:visible;">';
  // gridlines
  for (var g = 0; g <= 4; g++) {
    var gy = padT + innerH - (g / 4) * innerH;
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--line)" stroke-dasharray="3 3"/>';
  }
  data.forEach(function (d, i) {
    var x = padL + i * slot + (slot - barW) / 2;
    var yBase = padT + innerH;
    var segs = [
      { v: d.unanswered, c: STATUS_META.unanswered.color },
      { v: d.potential, c: STATUS_META.potential.color },
      { v: d.demo_booked, c: STATUS_META.demo_booked.color },
      { v: d.refused, c: STATUS_META.refused.color }
    ];
    var cursorY = yBase;
    segs.forEach(function (seg) {
      var h = (seg.v / maxVal) * innerH;
      if (h > 0) {
        svg += '<rect x="' + x + '" y="' + (cursorY - h) + '" width="' + barW + '" height="' + h + '" fill="' + seg.c + '"></rect>';
      }
      cursorY -= h;
    });
    svg += '<text x="' + (x + barW / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="Manrope">' + esc(d.agent) + '</text>';
  });
  svg += '</svg>';
  return svg;
}

function renderLineChart(data) {
  var W = 560, H = 220, padL = 30, padB = 22, padT = 8, padR = 8;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var allVals = [];
  data.forEach(function (d) { allVals.push(d.unanswered, d.potential, d.demo_booked, d.refused); });
  var maxVal = Math.max(1, Math.max.apply(null, allVals));
  var n = Math.max(1, data.length - 1);
  function xAt(i) { return padL + (i / n) * innerW; }
  function yAt(v) { return padT + innerH - (v / maxVal) * innerH; }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:220px;overflow:visible;">';
  for (var g = 0; g <= 4; g++) {
    var gy = padT + innerH - (g / 4) * innerH;
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="var(--line)" stroke-dasharray="3 3"/>';
  }
  ["unanswered", "potential", "demo_booked", "refused"].forEach(function (key) {
    var pts = data.map(function (d, i) { return xAt(i) + "," + yAt(d[key]); }).join(" ");
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + STATUS_META[key].color + '" stroke-width="2"></polyline>';
  });
  var step = Math.max(1, Math.ceil(data.length / 8));
  data.forEach(function (d, i) {
    if (i % step === 0 || i === data.length - 1) {
      svg += '<text x="' + xAt(i) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="Manrope">' + esc(d.day) + '</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

  root.querySelectorAll("[data-action]").forEach(function (el) {
    var action = el.getAttribute("data-action");
    var type = (el.tagName === "SELECT") ? "change" : (el.tagName === "FORM" ? "submit" : "click");
    if (action === "sort" || action === "quickLog" || action === "setPeriodType" || action === "setTrendDays" ||
        action === "quickChip" || action === "editCall" || action === "askDelete" || action === "deleteCall" ||
        action === "formStatus" || action === "setLang") {
      el.addEventListener("click", function (e) { handleAction(action, el, e, t); });
    } else if (type === "change") {
      el.addEventListener("change", function (e) { handleAction(action, el, e, t); });
    } else if (type === "submit") {
      el.addEventListener("submit", function (e) { handleAction(action, el, e, t); });
    } else {
      el.addEventListener("click", function (e) { handleAction(action, el, e, t); });
    }
  });

  var callForm = document.getElementById("call-form");
  if (callForm) {
    callForm.addEventListener("submit", submitForm);
    callForm.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  var qNaDate = document.getElementById("quick-na-date");
  if (qNaDate) qNaDate.addEventListener("change", function () {
    var last = findCall(state.lastLoggedId);
    if (!last) return;
    var type = qNaDate.getAttribute("data-type");
    if (!qNaDate.value) { updateCall(last.id, { nextAction: null }); render(); return; }
    var timeEl = document.getElementById("quick-na-time");
    var timeVal = (timeEl && timeEl.value) || (last.nextAction ? toInputTime(new Date(last.nextAction.dateTime)) : "09:00");
    updateCall(last.id, { nextAction: { type: type, dateTime: new Date(qNaDate.value + "T" + timeVal).toISOString(), notes: last.nextAction ? last.nextAction.notes : "" } });
    render();
  });
  var qNaTime = document.getElementById("quick-na-time");
  if (qNaTime) qNaTime.addEventListener("change", function () {
    var last = findCall(state.lastLoggedId);
    if (!last) return;
    var type = qNaTime.getAttribute("data-type");
    var dateEl = document.getElementById("quick-na-date");
    var dateVal = (dateEl && dateEl.value) || toInputDate(new Date());
    updateCall(last.id, { nextAction: { type: type, dateTime: new Date(dateVal + "T" + qNaTime.value).toISOString(), notes: last.nextAction ? last.nextAction.notes : "" } });
    render();
  });

  var quickClientInput = document.getElementById("quick-client-input");
  if (quickClientInput) {
    quickClientInput.addEventListener("input", function () { quickClientDraft = quickClientInput.value; quickSaved = false; });
    quickClientInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { saveQuickClientDraft(); quickSaved = true; render(); }
    });
  }

  var topAgentInput = document.getElementById("top-agent-input");
  if (topAgentInput) {
    topAgentInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); handleAction("commitTopAgent", topAgentInput, e, t); }
      if (e.key === "Escape") { state.addingAgentTop = false; render(); }
    });
  }
  var formAgentDraft = document.getElementById("form-agent-draft");
  if (formAgentDraft) {
    formAgentDraft.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); handleAction("commitFormAgent", formAgentDraft, e, t); }
      if (e.key === "Escape") { syncFormDraftFromDOM(); formDraft.addingAgent = false; render(); }
    });
  }
}

function handleAction(action, el, e, t) {
  var id = el.getAttribute("data-id");
  switch (action) {
    case "setLang":
      state.lang = el.getAttribute("data-lang"); saveLang(); render(); break;
    case "manualRefresh": refreshFromServer(false); break;
    case "agentSelect":
      if (el.value === "__new__") { state.addingAgentTop = true; render(); }
      else { state.currentAgent = el.value; saveCurrentAgent(); render(); }
      break;
    case "commitTopAgent": {
      var input = document.getElementById("top-agent-input");
      var name = input ? input.value.trim() : "";
      if (name) { addAgentIfNew(name); state.currentAgent = name; saveCurrentAgent(); }
      state.addingAgentTop = false; render();
      break;
    }
    case "cancelTopAgent": state.addingAgentTop = false; render(); break;
    case "askReset": state.confirmReset = true; render(); break;
    case "cancelReset": state.confirmReset = false; render(); break;
    case "resetAll": resetAllCalls(); break;
    case "quickLog": quickLog(el.getAttribute("data-status")); break;
    case "openDetailedForStatus": {
      state.editingId = null;
      formDraft = emptyFormDraft();
      formDraft.status = el.getAttribute("data-status");
      state.showForm = true;
      render();
      break;
    }
    case "openNewForm": openNewForm(); break;
    case "closeFollowup": state.lastLoggedId = null; render(); break;
    case "saveQuickClient": saveQuickClientDraft(); quickSaved = true; render(); break;
    case "quickChip": applyQuickNextAction(parseInt(el.getAttribute("data-days"), 10), el.getAttribute("data-type")); break;
    case "closeForm": closeForm(); break;
    case "formAgentSelect":
      syncFormDraftFromDOM();
      if (el.value === "__new__") { formDraft.addingAgent = true; formDraft.agent = ""; }
      else { formDraft.agent = el.value; }
      render();
      break;
    case "commitFormAgent": {
      syncFormDraftFromDOM();
      var name2 = (formDraft.agentDraft || "").trim();
      if (name2) { addAgentIfNew(name2); formDraft.agent = name2; }
      formDraft.addingAgent = false;
      render();
      break;
    }
    case "formStatus":
      syncFormDraftFromDOM();
      formDraft.status = el.getAttribute("data-status");
      render();
      break;
    case "setPeriodType": state.periodType = el.getAttribute("data-type"); state.periodOffset = 0; render(); break;
    case "periodPrev": state.periodOffset -= 1; render(); break;
    case "periodNext": state.periodOffset = Math.min(0, state.periodOffset + 1); render(); break;
    case "setFilterAgent": state.filterAgent = el.value; render(); break;
    case "setTrendDays": state.trendDays = parseInt(el.getAttribute("data-days"), 10); render(); break;
    case "setHistoryStatusFilter": state.historyStatusFilter = el.value; render(); break;
    case "sort": {
      var key = el.getAttribute("data-key");
      if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortKey = key; state.sortDir = key === "dateTime" ? "desc" : "asc"; }
      render();
      break;
    }
    case "editCall": { var c = findCall(id); if (c) openEditForm(c); break; }
    case "askDelete": state.confirmDeleteId = id; render(); break;
    case "deleteCall": deleteCall(id); break;
    default: break;
  }
}

// ================= boot =================

loadLocalPrefs();
loadRemoteData();

setInterval(function () {
  if (state.dataLoading || state.showForm || state.lastLoggedId || state.confirmDeleteId || state.confirmReset) return;
  refreshFromServer(true);
}, 30000);
</script>
</body>
</html>
